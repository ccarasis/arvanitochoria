<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>Arvanitochoria: Arvanite Cartographies of Mt. Arachnaio</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    
    <!-- Mapbox GL JS -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    
    <!-- Scrollama Library -->
    <script src="https://unpkg.com/scrollama"></script>

    <style>
        body { margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111; color: #fff; }
        #map { position: fixed; top:0; bottom:0; width:100%; z-index: 1; }
        #story { position: relative; z-index: 2; pointer-events: none; }
        #header { padding: 100px 20px 80px 20px; max-width: 600px; margin: 0 auto 50vh auto; text-align: center; background: rgba(30, 20, 15, 0.9); border-radius: 8px; border: 1px solid #5a402d; pointer-events: auto; }
        #header h1 { margin: 0 0 10px 0; font-size: 2rem; color: #fdfbf7; }
        #header h2 { margin: 0 0 15px 0; font-size: 1.1rem; color: #c9b8a3; font-weight: normal; }
        #header p { margin: 0; font-size: 0.9rem; color: #a8947d; }
        
        .step { padding: 25vh 0; max-width: 500px; margin: 0 auto; pointer-events: auto; }
        .step-content { background: rgba(30, 20, 15, 0.9); padding: 25px; border-radius: 8px; border: 1px solid #5a402d; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .step-content h3 { margin-top:0; color: #fdfbf7; border-bottom: 1px solid #5a402d; padding-bottom: 8px; }
        .step-content p { color: #e8ded1; line-height: 1.5; font-size: 0.95rem; }
        .step-content img { width: 100%; border-radius: 4px; margin-bottom: 10px; }
        
        #footer { padding: 40px 20px; text-align: center; font-size: 0.85rem; color: #8c6d53; background: #1a100a; position: relative; z-index: 2; pointer-events: auto; }
        
        .left { margin-left: 8vw; }
        .right { margin-left: auto; margin-right: 8vw; }
        .centered { margin: 0 auto; }

        @media (max-width: 768px) {
            .left, .right { margin: 0 auto; padding: 10vh 15px; }
        }
    </style>
</head>
<body>

<div id="map"></div>

<div id="story">
    <div id="header">
        <h1 id="title"></h1>
        <h2 id="subtitle"></h2>
        <p id="byline"></p>
    </div>
    <div id="features"></div>
    <div id="footer"></div>
</div>

<!-- LINK TO YOUR CONFIG FILE -->
<script src="./config.js"></script>

<script>
// Check if config loaded properly
if (typeof config !== 'undefined') {
    document.getElementById('title').innerText = config.title;
    document.getElementById('subtitle').innerText = config.subtitle;
    document.getElementById('byline').innerHTML = config.byline;
    document.getElementById('footer').innerText = config.footer;

    var features = document.getElementById('features');
    config.chapters.forEach((record) => {
        var div = document.createElement('div');
        div.className = 'step ' + record.alignment;
        div.id = record.id;
        
        var content = document.createElement('div');
        content.className = 'step-content';
        
        if (record.title) {
            var title = document.createElement('h3');
            title.innerText = record.title;
            content.appendChild(title);
        }
        if (record.image) {
            var img = document.createElement('img');
            img.src = record.image;
            content.appendChild(img);
        }
        if (record.description) {
            var p = document.createElement('p');
            p.innerHTML = record.description;
            content.appendChild(p);
        }
        div.appendChild(content);
        features.appendChild(div);
    });

    mapboxgl.accessToken = config.accessToken;
    
    var map = new mapboxgl.Map({
        container: 'map',
        style: config.style,
        center: config.chapters[0].location.center,
        zoom: config.chapters[0].location.zoom,
        bearing: config.chapters[0].location.bearing,
        pitch: config.chapters[0].location.pitch,
        interactive: false
    });

    map.on('style.load', function() {
        if (config.use3dTerrain) {
            map.addSource('mapbox-dem', {
                'type': 'raster-dem',
                'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
                'tileSize': 512,
                'maxzoom': 14
            });
            map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });
        }
    });

    var scroller = scrollama();
    scroller
        .setup({
            step: '.step',
            offset: 0.5,
            progress: true
        })
        .onStepEnter(response => {
            var chapter = config.chapters.find(chap => chap.id === response.element.id);
            if (chapter) {
                map[chapter.mapAnimation || 'flyTo'](chapter.location);
            }
        });

    window.addEventListener('resize', scroller.resize);
} else {
    console.error("config.js was not found or has syntax errors.");
}
</script>

</body>
</html>
