<!-- Inside your <style> section -->
<style>
  /* Historical Slider Control */
  #slider-container {
    position: absolute;
    bottom: 30px;
    left: 340px;
    background: #3d2b1f;
    color: #fdfbf7;
    padding: 10px 15px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.85rem;
    border: 1px solid #8c6d53;
  }
</style>

<!-- Inside your <body>, right after #container -->
<div id="slider-container">
  <span><b>1945 Aerial View Opacity:</b></span>
  <input id="opacity-slider" type="range" min="0" max="100" value="70">
</div>

<!-- Inside your <script> under map.on('style.load') -->
<script>
  map.on('style.load', () => {
    // 1. Add 3D Terrain Dem
    map.addSource('mapbox-dem', {
      'type': 'raster-dem',
      'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
      'tileSize': 512,
      'maxzoom': 14
    });
    map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.8 });

    // 2. Add Ktimanet / Historical 1945 Air Photo Tile Source
    // (Note: Ktimanet WMS Endpoint or Mapbox Tileset ID goes here)
    map.addSource('ktimanet-1945', {
      'type': 'raster',
      'tiles': [
        'https://gis.ktimanet.gr/wms/wmsopen/wmsserver.aspx?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=KT_1945&STYLES=&SRS=EPSG:3857&BBOX={bbox-epsg-3857}&WIDTH=256&HEIGHT=256&FORMAT=image/jpeg'
      ],
      'tileSize': 256
    });

    // 3. Add Historical Layer on Top of 3D Terrain
    map.addLayer({
      'id': 'ktimanet-layer',
      'type': 'raster',
      'source': 'ktimanet-1945',
      'paint': {
        'raster-opacity': 0.7 // Default 70% opacity
      }
    });

    // 4. Connect Slider to Fade Between 1945 and Today
    document.getElementById('opacity-slider').addEventListener('input', (e) => {
      map.setPaintProperty('ktimanet-layer', 'raster-opacity', parseInt(e.target.value, 10) / 100);
    });
  });
</script>
