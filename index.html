
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Arvanitochoria</title>

  <!-- Mapbox -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.css"
    rel="stylesheet"
  >

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.js"></script>

  <!-- Scrollama -->
  <script src="https://unpkg.com/scrollama"></script>

  <!-- Story configuration -->
  <script src="./config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      -webkit-text-size-adjust: 100%;
    }

    /* MAP */

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* STORY */

    #story {
      position: relative;
      z-index: 2;
    }

    /* HEADER */

    #header {
      position: relative;
      height: 400px;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    #header-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    #header::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.25),
          rgba(0, 0, 0, 0.55) 55%,
          rgba(0, 0, 0, 0.85)
        );

      z-index: -1;
    }

    #header-content {
      width: min(1000px, 90%);
      margin-top: 40px;

      text-shadow:
        0 3px 8px rgba(0, 0, 0, 0.9);
    }

    #title {
      margin: 0;
      font-size: clamp(50px, 7vw, 105px);
      line-height: 1;
      font-weight: 400;
    }

    #subtitle {
      margin-top: 20px;
      font-size: clamp(25px, 3vw, 42px);
      line-height: 1.2;
    }

    #byline {
      margin-top: 30px;
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    /* CHAPTERS */

    .step {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 80px 5vw;
    }

    .step.left {
      justify-content: flex-start;
    }

    .step.right {
      justify-content: flex-end;
    }

    .step-content {
      width: min(590px, 88vw);
      padding: 34px 40px;
      background: rgba(70, 43, 27, 0.94);
      border-radius: 4px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.35);
    }

    .step-content h2 {
      margin: 0 0 22px;
      font-size: 30px;
      line-height: 1.15;
      font-weight: 400;
    }

    .step-content p {
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.65;
    }

    /* ORAL HISTORY VIDEOS */

    .oral-history-video {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-top: 24px;
    }

    .oral-history-video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      #header {
        height: 380px;
      }

      #header-content {
        width: 90%;
        margin-top: 20px;
      }

      #title {
        font-size: 50px;
      }

      #subtitle {
        margin-top: 14px;
        font-size: 22px;
      }

      #byline {
        margin-top: 20px;
        font-size: 14px;
      }

      .step {
        min-height: 100vh;
        padding: 50px 5vw;
        justify-content: center !important;
      }

      .step-content {
        width: 90vw;
        max-width: 90vw;
        padding: 25px 24px;
      }

      .step-content h2 {
        margin-bottom: 16px;
        font-size: 28px;
      }

      .step-content p {
        font-size: 17px;
        line-height: 1.6;
      }
    }
  </style>
</head>

<body>

  <!-- MAP -->
  <div id="map"></div>

  <!-- STORY -->
  <main id="story">

    <!-- TITLE -->
    <header id="header">
      <div id="header-content">
        <h1 id="title"></h1>
        <div id="subtitle"></div>
        <div id="byline"></div>
      </div>
    </header>

    <!-- CHAPTERS -->
    <section id="chapters"></section>

  </main>

  <script>

    /*
     * MAP
     */

    mapboxgl.accessToken = config.accessToken;

    const map = new mapboxgl.Map({
      container: "map",
      style: config.style,
      interactive: false
    });


    /*
     * RESPONSIVE CAMERA
     */

    function getResponsiveLocation(location) {
      let zoomAdjustment = 0;

      if (window.innerWidth <= 480) {
        zoomAdjustment = -0.8;
      } else if (window.innerWidth <= 700) {
        zoomAdjustment = -0.6;
      }

      return {
        center: location.center,
        zoom: location.zoom + zoomAdjustment,
        pitch: location.pitch ?? 0,
        bearing: location.bearing ?? 0
      };
    }


    /*
     * TERRAIN
     * Uses terrain configured in Mapbox Studio.
     */

    map.on("style.load", () => {

      const terrain = map.getStyle().terrain;

      if (terrain) {
        map.setTerrain(terrain);
      }

      const firstChapter = config.chapters[0];

      if (firstChapter && firstChapter.location) {
        map.jumpTo(
          getResponsiveLocation(firstChapter.location)
        );
      }

    });


    /*
     * HEADER IMAGE
     */

    const titleImage =
      config.title.match(
        /<img[^>]+src=["']([^"']+)["']/i
      );

    if (titleImage) {

      const image =
        document.createElement("img");

      image.id = "header-image";
      image.src = titleImage[1];

      document
        .getElementById("header")
        .prepend(image);

      document.getElementById("title")
        .textContent =
        config.title
          .replace(/<img[^>]*>/i, "")
          .replace(/<br\s*\/?\s*>/gi, "")
          .trim();

    } else {

      document.getElementById("title")
        .textContent = config.title;

    }

    document.getElementById("subtitle")
      .textContent = config.subtitle;

    document.getElementById("byline")
      .innerHTML = config.byline;


    /*
     * BUILD CHAPTERS
     *
     * Chapter 0 controls the opening camera
     * and has no visible story box.
     */

    const chapters =
      document.getElementById("chapters");

    config.chapters.forEach((chapter) => {

      if (chapter.id === "chapter-0") {
        return;
      }

      const section =
        document.createElement("section");

      section.className =
        `step ${chapter.alignment || "left"}`;

      section.dataset.id = chapter.id;

      section.innerHTML = `
        <div class="step-content">

          <h2>${chapter.title}</h2>

          <p>${chapter.description}</p>

          ${chapter.videoId ? `
            <div class="oral-history-video">
              <iframe
                src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(chapter.videoId)}?cc_load_policy=1"
                title="Oral history: Arvanitika vocabulary from Limnes"
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
              ></iframe>
            </div>
          ` : ''}

        </div>
      `;

      chapters.appendChild(section);

    });


    /*
     * SCROLLAMA
     */

    const scroller = scrollama();

    function handleStepEnter(response) {

      const id =
        response.element.dataset.id;

      const chapter =
        config.chapters.find(
          item => item.id === id
        );

      if (!chapter || !chapter.location) {
        return;
      }

      const location =
        getResponsiveLocation(chapter.location);

      map.flyTo({
        center: location.center,
        zoom: location.zoom,
        pitch: location.pitch,
        bearing: location.bearing,
        duration: 1800,
        essential: true
      });

    }


    scroller
      .setup({
        step: ".step",
        offset: 0.5
      })
      .onStepEnter(handleStepEnter);


    /*
     * RESIZE
     */

    window.addEventListener(
      "resize",
      () => {
        map.resize();
        scroller.resize();
      }
    );

  </script>

</body>
</html>
