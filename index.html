<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mapbox Scrollytelling Engine</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/scrollama"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #000; color: #fff; }
        #map { position: fixed; top: 0; bottom: 0; left: 0; right: 0; width: 100vw; height: 100vh; }
        #story { position: relative; z-index: 1; pointer-events: none; }
        #header { padding: 30px 20px; max-width: 650px; margin: 0 auto 40vh auto; text-align: center; background: rgba(30, 20, 15, 0.9); border-radius: 8px; border: 1px solid #5a402d; pointer-events: auto; }
        .step { padding: 20vh 0; max-width: 500px; margin: 0 auto; pointer-events: auto; }
        .step div { padding: 25px; background: rgba(20, 20, 20, 0.85); border-radius: 8px; font-size: 1rem; line-height: 1.6; }
        #footer { padding: 40px 20px; text-align: center; font-size: 0.9rem; background: rgba(0,0,0,0.8); }
    </style>
</head>
<body>

<div id="map"></div>
<div id="story">
    <div id="header"></div>
    <div id="sections"></div>
    <div id="footer"></div>
</div>

<script src="./config.js"></script>
<script>
    mapboxgl.accessToken = config.accessToken;

    var map = new mapboxgl.Map({
        container: 'map',
        style: config.style,
        center: config.chapters[0].location.center,
        zoom: config.chapters[0].location.zoom,
        bearing: 0,
        pitch: 0,
        interactive: false
    });

    map.on('load', function() {
        map.resize();
        if (config.use3dTerrain) {
            map.addSource('mapbox-dem', {
                'type': 'raster-dem',
                'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
                'tileSize': 512,
                'maxzoom': 14
            });
            map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });
        }
        setTimeout(function() {
            map.resize();
            map.easeTo({
                pitch: config.chapters[0].location.pitch || 60,
                bearing: config.chapters[0].location.bearing || 0,
                duration: 1200
            });
        }, 300);
    });

    // Render Header with HTML support
    var header = document.getElementById('header');
    if (config.title) {
        var title = document.createElement('h1');
        title.innerHTML = config.title; // ALLOWS IMAGES IN TITLE
        header.appendChild(title);
    }
    if (config.subtitle) {
        var subtitle = document.createElement('h2');
        subtitle.innerText = config.subtitle;
        header.appendChild(subtitle);
    }
    if (config.byline) {
        var byline = document.createElement('p');
        byline.innerHTML = config.byline;
        header.appendChild(byline);
    }

    // Render Chapters
    var sections = document.getElementById('sections');
    config.chapters.forEach(function(record, index) {
        var container = document.createElement('div');
        container.className = 'step';
        container.id = record.id;
        
        var chapterCard = document.createElement('div');
        if (record.title) {
            var title = document.createElement('h3');
            title.innerText = record.title;
            chapterCard.appendChild(title);
        }
        if (record.description) {
            var desc = document.createElement('p');
            desc.innerHTML = record.description;
            chapterCard.appendChild(desc);
        }
        container.appendChild(chapterCard);
        sections.appendChild(container);
    });

    document.getElementById('footer').innerText = config.footer || '';

    // Scrollama Setup
    var scroller = scrollama();
    scroller.setup({ step: '.step', offset: 0.5 }).onStepEnter(function(response) {
        var chapter = config.chapters.find(function(chap) { return chap.id === response.element.id; });
        if (chapter) {
            map.flyTo(chapter.location);
        }
    });

    window.addEventListener('resize', scroller.resize);
</script>
</body>
</html>
