
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arvanitochoria</title>

<link href="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.js"></script>
<script src="https://unpkg.com/scrollama"></script>
<script src="./config.js"></script>

<style>
*{box-sizing:border-box}
html{scroll-padding-top:70px;background:#233e43}
html,body{
  margin:0;padding:0;color:white;
  font-family:Georgia,"Times New Roman",serif;
  -webkit-text-size-adjust:100%;
}
body{background:transparent}
#map{
  position:fixed;inset:0;width:100%;height:100%;
  z-index:1;pointer-events:none;
}
#story,#chapters{
  position:relative;z-index:2;background:transparent;
}

/* NAVIGATION */

#top-nav{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;min-height:54px;
  padding:9px clamp(14px,3vw,32px);
  background:rgba(54,34,24,.85);
  box-shadow:0 2px 12px rgba(0,0,0,.18);
  transition:opacity .35s ease;
}
body.viewing-static-map #top-nav{
  opacity:0;pointer-events:none;
}
#nav-brand{
  color:#f7eee5;font:17px Georgia,serif;
  text-decoration:none;white-space:nowrap;
}
.nav-actions{
  display:flex;align-items:center;gap:15px;
}
.language-switch{
  display:flex;align-items:center;gap:5px;white-space:nowrap;
}
.language-button,#menu-toggle{
  color:#f7eee5;background:transparent;border:0;
  font:13px Georgia,serif;cursor:pointer;
}
.language-button{padding:4px;opacity:.6}
.language-button[aria-pressed="true"]{
  opacity:1;font-weight:bold;text-decoration:underline;
}
#menu-toggle{
  display:flex;align-items:center;gap:8px;
  padding:5px 8px;font-size:14px;white-space:nowrap;
}
.menu-icon{font-size:18px;line-height:1}
.nav-links{
  display:none;position:absolute;top:100%;right:0;
  width:min(430px,100vw);max-height:calc(100dvh - 54px);
  overflow-y:auto;flex-direction:column;align-items:stretch;
  gap:0;padding:14px 18px 20px;
  background:rgba(54,34,24,.97);
  box-shadow:0 12px 20px rgba(0,0,0,.28);
  border-radius:0 0 0 5px;
}
.nav-links.open{display:flex}
.nav-link{
  display:block;padding:11px 8px;color:#f7eee5;
  font:14px/1.4 Georgia,serif;
  text-decoration:none;text-align:left;
}
.nav-link:visited{color:#f7eee5}
.nav-link:hover,.language-button:hover,#menu-toggle:hover{
  text-decoration:underline;text-underline-offset:4px;
}
.nav-link.nav-secondary{
  border-top:1px solid rgba(247,238,229,.18);
  margin-top:8px;padding-top:16px;
}
.nav-link[hidden]{display:none!important}

/* HEADER */

#header{
  position:relative;isolation:isolate;height:400px;
  overflow:hidden;display:flex;align-items:center;
  justify-content:center;text-align:center;
}
#header-image{
  position:absolute;inset:0;z-index:0;
  width:100%;height:100%;object-fit:cover;
  object-position:center;
  -webkit-mask-image:linear-gradient(
    to bottom,#000 0%,#000 70%,transparent 100%
  );
  mask-image:linear-gradient(
    to bottom,#000 0%,#000 70%,transparent 100%
  );
}
#header::after{
  content:"";position:absolute;inset:0;z-index:1;
  pointer-events:none;
  background:linear-gradient(
    to right,
    rgba(35,24,18,.65) 0%,
    rgba(35,24,18,.35) 45%,
    rgba(35,24,18,.05) 85%
  );
  -webkit-mask-image:linear-gradient(
    to bottom,#000 0%,#000 70%,transparent 100%
  );
  mask-image:linear-gradient(
    to bottom,#000 0%,#000 70%,transparent 100%
  );
}
#header-content{
  position:relative;z-index:2;
  width:min(1100px,90%);margin:10px auto 0;
  padding-left:2%;text-align:left;
  text-shadow:0 3px 8px rgba(0,0,0,.75);
}
#title{
  margin:0;font-size:clamp(44px,6vw,88px);
  line-height:1.05;font-weight:400;
}
#subtitle{
  margin-top:18px;max-width:650px;
  font-size:clamp(22px,2.5vw,34px);
  line-height:1.25;
}

/* CHAPTERS */

.step{
  position:relative;z-index:2;min-height:100vh;
  display:flex;align-items:center;
  padding:80px 5vw;scroll-margin-top:54px;
  background:transparent;
}
.step.left{justify-content:flex-start}
.step.right{justify-content:flex-end}
.step-content{
  width:min(590px,88vw);padding:34px 40px;
  background:rgba(70,43,27,.70);border-radius:4px;
  box-shadow:0 5px 20px rgba(0,0,0,.18);
}
.step-content h2{
  margin:0 0 22px;font-size:30px;
  line-height:1.15;font-weight:400;
}
.step-content p{
  margin:0;font:18px/1.65 Arial,sans-serif;
  white-space:pre-line;
}

/* EIGHT-VILLAGE MAP PAUSE */

.map-breathing-space{
  position:relative;z-index:2;width:100%;
  height:80vh;height:80dvh;
  background:transparent;pointer-events:none;
}

/* VIDEOS */

.oral-history-video{
  position:relative;width:100%;aspect-ratio:16/9;
  margin-top:24px;
}
.oral-history-video iframe{
  position:absolute;inset:0;width:100%;height:100%;border:0;
}

/* STATIC MAPS */

.geography-map-feature,.memory-map-feature{
  position:relative;z-index:5;display:flow-root;
  width:100%;margin:0;padding:0;
  background:transparent;color:#302820;text-align:center;
}
.geography-map-feature figure,.memory-map-feature figure{
  display:block;width:100%;margin:0;padding:0;
}
.geography-image-container{position:relative;width:100%}
.geography-image-link,.memory-map-feature .map-open{
  display:block;width:100%;margin:0;padding:0;
  border:0;border-radius:0;background:white;
  line-height:0;cursor:zoom-in;
  -webkit-mask-image:linear-gradient(
    to bottom,transparent 0%,#000 10%,#000 100%
  );
  mask-image:linear-gradient(
    to bottom,transparent 0%,#000 10%,#000 100%
  );
}
.memory-map-feature .map-open{
  appearance:none;-webkit-appearance:none;
}
.geography-image,.memory-map-feature .map-open img{
  display:block;width:100%;height:auto;
  max-width:none;max-height:none;
  margin:0;padding:0;border:0;
  object-fit:contain;background:white;
}

/* GIS LEGEND */

.geography-legend{
  position:absolute;z-index:6;
  bottom:clamp(14px,2.5vw,35px);
  left:clamp(12px,2.5vw,35px);
  width:min(380px,calc(100% - 24px));
  padding:14px 16px;
  background:rgba(255,255,255,.93);
  color:#403a34;
  border:1px solid rgba(80,65,50,.12);
  border-radius:4px;
  box-shadow:0 3px 16px rgba(0,0,0,.12);
  text-align:left;pointer-events:none;
}
.geography-legend-heading{
  display:block;margin-bottom:12px;
  font:17px/1.4 Georgia,serif;text-align:center;
}
.geography-legend-item{
  display:flex;align-items:center;gap:13px;
  margin:9px 0;font:13px/1.45 Arial,sans-serif;
}
.geography-legend-swatch{
  flex:0 0 34px;width:34px;height:23px;
  border:1px solid rgba(90,75,60,.12);
}
.geography-legend-swatch.core{background:#ffd49a}
.geography-legend-swatch.fieldwork{background:#e6ac91}
.geography-legend-swatch.blended{background:#d5c4a7}

/* MAP CAPTIONS */

.geography-map-feature figcaption,
.memory-map-feature figcaption{
  display:block;width:100%;margin:0;
  padding:8px 5vw 10px;background:white;
  color:#625b54;text-align:center;
}
.geography-title{
  display:block;max-width:1000px;margin:0 auto 3px;
  font:13px/1.4 Georgia,serif;
}
.geography-caption{
  display:block;max-width:1000px;margin:0 auto;
  font:11px/1.45 Arial,sans-serif;
}
.geography-method-note{
  display:block;max-width:900px;margin:9px auto 0;
  font:italic 11px/1.55 Arial,sans-serif;
}
.memory-map-feature h2{
  max-width:1000px;margin:0 auto 3px;
  color:#302820;font:15px/1.4 Georgia,serif;
}
.memory-map-feature .map-credit{
  margin:0 auto 6px;font:italic 12px/1.4 Georgia,serif;
}
.memory-map-feature .map-caption{
  max-width:900px;margin:0 auto;
  font:12px/1.55 Arial,sans-serif;
  white-space:pre-line;
}
.memory-map-feature .map-hint{
  margin:6px 0 0;color:#77716a;
  font:italic 11px/1.4 Georgia,serif;
}
.cutaway-fade-out{
  display:block;width:100%;
  height:clamp(45px,7vw,100px);
  pointer-events:none;
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,1) 0%,
    rgba(255,255,255,.9) 15%,
    rgba(255,255,255,.55) 55%,
    rgba(255,255,255,0) 100%
  );
}

/* FULL-SCREEN PHOTOGRAPHS */

.landscape-photo-feature{
  position:relative;z-index:4;width:100%;
  height:100vh;height:100dvh;
  margin:0;padding:0;overflow:hidden;
  background:transparent;
}
.landscape-photo-feature figure{
  position:relative;width:100%;height:100%;
  margin:0;padding:0;
}
.landscape-photo-feature img{
  display:block;width:100%;height:100%;
  object-fit:cover;object-position:center;
  -webkit-mask-image:linear-gradient(
    to bottom,
    transparent 0%,#000 10%,#000 90%,transparent 100%
  );
  mask-image:linear-gradient(
    to bottom,
    transparent 0%,#000 10%,#000 90%,transparent 100%
  );
}
.landscape-photo-feature figure::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(
    to bottom,
    transparent 60%,
    rgba(0,0,0,.2) 75%,
    rgba(0,0,0,.85)
  );
  -webkit-mask-image:linear-gradient(
    to bottom,
    transparent 0%,#000 10%,#000 90%,transparent 100%
  );
  mask-image:linear-gradient(
    to bottom,
    transparent 0%,#000 10%,#000 90%,transparent 100%
  );
}
.landscape-photo-feature figcaption{
  position:absolute;z-index:2;bottom:6%;
  left:50%;transform:translateX(-50%);
  width:min(1100px,90%);color:white;
  font:italic clamp(14px,1.2vw,17px)/1.6 Georgia,serif;
  text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.9);
}
.photo-credit{
  display:block;margin-top:6px;
  font-size:.88em;font-style:normal;
}

/* MARIA MAP ENLARGEMENT */

.memory-map-dialog{
  position:fixed;inset:0;z-index:50;
  width:100%;height:100%;
  max-width:none;max-height:none;
  margin:0;padding:55px 15px 15px;
  border:0;background:rgba(15,10,7,.97);color:white;
}
.memory-map-dialog:not([open]){display:none}
.memory-map-dialog[open]{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.memory-map-dialog img{
  max-width:100%;max-height:calc(100dvh - 90px);
  object-fit:contain;
}
.close-map{
  position:absolute;top:10px;right:16px;
  color:white;background:transparent;
  border:1px solid white;border-radius:4px;
  padding:7px 12px;cursor:pointer;font-size:15px;
}

/* ABOUT THE PROJECT */

.about-project{
  position:relative;z-index:5;
  padding:75px 30px 55px;
  background:linear-gradient(
    to bottom,
    rgba(54,34,24,0) 0%,
    rgba(54,34,24,.55) 28%,
    rgba(54,34,24,.78) 65%,
    rgba(54,34,24,.85) 100%
  );
  color:#f7eee5;scroll-margin-top:54px;
}
.about-project-content{
  max-width:950px;margin:0 auto;text-align:center;
}
.about-project h2{
  margin:0 0 14px;
  font:normal 23px/1.3 Georgia,serif;
}
.about-project p{
  margin:0;font:15px/1.7 Georgia,serif;
}

/* MOBILE */

@media(max-width:700px){
  #nav-brand{font-size:15px}
  .nav-actions{gap:7px}
  #menu-toggle{font-size:13px;gap:5px}
  .nav-links{width:100%;border-radius:0}
  .nav-link{font-size:14px}

  #header{height:380px}
  #header-content{
    width:90%;padding-left:0;text-align:center;
  }
  #title{font-size:clamp(36px,11vw,50px)}
  #subtitle{
    margin:14px auto 0;font-size:22px;
  }

  .step{
    min-height:100vh;
    padding:65px 5vw 50px;
    justify-content:center!important;
  }
  .step-content{
    width:90vw;max-width:90vw;padding:25px 24px;
  }
  .step-content h2{
    margin-bottom:16px;font-size:28px;
  }
  .step-content p{
    font-size:17px;line-height:1.6;
  }

  .map-breathing-space{
    height:65vh;height:65dvh;
  }

  .landscape-photo-feature figcaption{
    bottom:9%;width:88%;font-size:14px;
  }

  /* BOTH BERBATI BRIDGES VISIBLE ON MOBILE */

  #berbati-bridges-photo{
    height:auto;min-height:0;
  }
  #berbati-bridges-photo figure{
    height:auto;
  }
  #berbati-bridges-photo img{
    display:block;width:100%;height:auto;
    object-fit:contain;object-position:center;
    -webkit-mask-image:linear-gradient(
      to bottom,
      transparent 0%,#000 10%,#000 90%,transparent 100%
    );
    mask-image:linear-gradient(
      to bottom,
      transparent 0%,#000 10%,#000 90%,transparent 100%
    );
  }
  #berbati-bridges-photo figcaption{
    position:relative;bottom:auto;left:auto;
    transform:none;width:100%;
    padding:12px 20px 18px;
    background:rgba(54,34,24,.80);
    font-size:13px;line-height:1.5;
  }
  #berbati-bridges-photo figure::after{
    display:none;
  }

  .geography-map-feature figcaption,
  .memory-map-feature figcaption{
    padding:8px 14px 10px;
  }
  .geography-title{font-size:12px}
  .geography-caption{font-size:10px}
  .geography-method-note{font-size:10px}

  /* COMPACT MOBILE GIS LEGEND */

  .geography-legend{
    left:6px;bottom:6px;
    width:175px;max-width:48%;
    padding:6px 7px;border-radius:3px;
    background:rgba(255,255,255,.90);
    box-shadow:0 2px 6px rgba(0,0,0,.10);
  }
  .geography-legend-heading{
    font-size:9px;line-height:1.15;margin-bottom:5px;
  }
  .geography-legend-item{
    font-size:8px;line-height:1.2;
    gap:5px;margin:4px 0;
  }
  .geography-legend-swatch{
    flex:0 0 13px;width:13px;height:11px;
  }

  .memory-map-feature h2{font-size:14px}
  .memory-map-feature .map-credit{font-size:11px}
  .memory-map-feature .map-caption{font-size:11px}
  .memory-map-feature .map-hint{font-size:10px}

  .about-project{padding:65px 22px 45px}
  .about-project h2{font-size:21px}
  .about-project p{font-size:14px;line-height:1.7}
}
</style>
</head>

<body>

<div id="map"></div>

<nav id="top-nav" aria-label="Main navigation">
  <a id="nav-brand" href="#header">Arvanitochoria</a>

  <div class="nav-actions">
    <div class="language-switch"
         role="group"
         aria-label="Website language">
      <button type="button"
              class="language-button"
              data-lang="en"
              aria-pressed="true">EN</button>
      <span aria-hidden="true">|</span>
      <button type="button"
              class="language-button"
              data-lang="el"
              aria-pressed="false">ΕΛ</button>
    </div>

            type="button"
            aria-expanded="false"
            aria-controls="nav-links">
      <span id="menu-label">Menu</span>
      <span class="menu-icon" aria-hidden="true">☰</span>
    </button>
  </div>

  <div class="nav-links" id="nav-links">

       href="#chapter-1"
       data-nav="chapter1">Chapter 1</a>

    <a class="nav-link"

  <header id="header">
    <div id="header-content">
      <h1 id="title"></h1>
      <div id="subtitle"></div>
    </div>
  </header>

  <section id="chapters"></section>

<script>

/* MAPBOX */

mapboxgl.accessToken=config.accessToken;

const map=new mapboxgl.Map({
  container:"map",
  style:config.style,
  interactive:false
});

function getResponsiveLocation(location){
  let adjustment=0;

  if(window.innerWidth<=480){
    adjustment=-0.8;
  }else if(window.innerWidth<=700){
    adjustment=-0.6;
  }

  return{
    center:location.center,
    zoom:location.zoom+adjustment,
    pitch:location.pitch??0,
    bearing:location.bearing??0
  };
}

map.on("style.load",()=>{
  const terrain=map.getStyle().terrain;

  if(terrain){
    map.setTerrain(terrain);
  }

  const first=config.chapters[0];

  if(first?.location){
    map.jumpTo(getResponsiveLocation(first.location));
  }
});

/* HEADER */

const titleImage=config.title.match(
  /<img[^>]+src=["']([^"']+)["']/i
);

if(titleImage){
  const image=document.createElement("img");
  image.id="header-image";
  image.src=titleImage[1];
  image.alt="Mt. Arachnaio landscape";
  document.getElementById("header").prepend(image);
}

const englishTitle=config.title
  .replace(/<img[^>]*>/i,"")
  .replace(/<br\s*\/?\s*>/gi,"")
  .trim();

/* NAVIGATION TRANSLATIONS */

const navLabels={
  en:{
    chapter1:"Chapter 1: What are the Arvanitochoria?",
    chapter2:"Chapter 2: A Brief History of Mt. Arachnaio",
    chapter3:"Chapter 3: Life on the Mountain",
    chapter4:"Chapter 4: Agriculture & Pastoral Life",
    chapter5:"Chapter 5: Folk Traditions",
    chapter6:"Chapter 6: The Future",
    archive:"Video Archive",
    about:"About the Project"
  },
  el:{
    chapter1:"Κεφάλαιο 1: Τι είναι τα Αρβανιτοχώρια;",
    chapter2:"Κεφάλαιο 2: Μια Σύντομη Ιστορία του Όρους Αραχναίου",
    chapter3:"Κεφάλαιο 3: Η Ζωή στο Βουνό",
    chapter4:"Κεφάλαιο 4: Γεωργία και Κτηνοτροφία",
    chapter5:"Κεφάλαιο 5: Λαϊκές Παραδόσεις",
    chapter6:"Κεφάλαιο 6: Το Μέλλον",
    archive:"Αρχείο Βίντεο",
    about:"Σχετικά με το Έργο"
  }
};

/* ARCGIS MAP TRANSLATIONS */

const geographyTranslations={
  en:{
    title:"Geographic Distribution of Arvanite Settlement Regions in Southern Greece",
    caption:"Map created by Christina Maria Carasis using ArcGIS, referencing settlement data from Lithoxoou (n.d.) and regional ethnolinguistic boundaries from Philippson (1890) and Tsitsipis (1998).",
    alt:"Map of reported historical Arvanite settlement and presence in Southern Greece",
    legendHeading:"Historical Arvanite Settlement and Presence",
    core:"Regions Traditionally Associated with Arvanite Settlement",
    fieldwork:"Fieldwork Area: Mt. Arachnaio & Argolida/Corinthia",
    blended:"Predominantly Greek-Speaking Areas with Reported Limited Arvanite Presence",
    methodNote:"Shaded regions reflect historical accounts, local traditions, and scholarly interpretations of Arvanite settlement. They are approximate and do not represent exclusive ethnic territories, official population classifications, or fixed linguistic boundaries."
  },
  el:{
    title:"Γεωγραφική Κατανομή των Περιοχών Αρβανίτικης Εγκατάστασης στη Νότια Ελλάδα",
    caption:"Χάρτης που δημιουργήθηκε από τη Χριστίνα Μαρία Καράση με τη χρήση του ArcGIS, με βάση δεδομένα οικισμών από τον Lithoxoou (χ.χ.) και περιφερειακά εθνογλωσσικά όρια από τους Philippson (1890) και Tsitsipis (1998).",
    alt:"Χάρτης αναφερόμενης ιστορικής αρβανίτικης εγκατάστασης και παρουσίας στη Νότια Ελλάδα",
    legendHeading:"Ιστορική Αρβανίτικη Εγκατάσταση και Παρουσία",
    core:"Περιοχές που Παραδοσιακά Συνδέονται με Αρβανίτικη Εγκατάσταση",
    fieldwork:"Περιοχή Επιτόπιας Έρευνας: Όρος Αραχναίο και Αργολίδα/Κορινθία",
    blended:"Κυρίως Ελληνόφωνες Περιοχές με Αναφερόμενη Περιορισμένη Αρβανίτικη Παρουσία",
    methodNote:"Οι σκιασμένες περιοχές βασίζονται σε ιστορικές μαρτυρίες, τοπικές παραδόσεις και επιστημονικές ερμηνείες της αρβανίτικης εγκατάστασης. Τα όριά τους είναι κατά προσέγγιση και δεν δηλώνουν αποκλειστικές εθνοτικές επικράτειες, επίσημες πληθυσμιακές ταξινομήσεις ή σταθερά γλωσσικά όρια."

/* HIDE NAVIGATION OVER STATIC MAPS */

const staticMapSections=[
  document.getElementById("arvanite-geography-map"),
  document.getElementById("maria-school-map")
].filter(Boolean);

let visibilityUpdatePending=false;

function updateStaticMapVisibility(){
  visibilityUpdatePending=false;

  const middle=window.innerHeight*.5;

  const viewingMap=staticMapSections.some(section=>{
    const rect=section.getBoundingClientRect();
    return rect.top<=middle&&rect.bottom>=middle;
  });

  document.body.classList.toggle(
    "viewing-static-map",
    viewingMap
  );
}

function requestVisibilityUpdate(){
  if(visibilityUpdatePending)return;

  visibilityUpdatePending=true;
  requestAnimationFrame(updateStaticMapVisibility);
}

window.addEventListener(
  "scroll",
  requestVisibilityUpdate,
  {passive:true}
);

window.addEventListener(
  "resize",
  requestVisibilityUpdate
);

requestVisibilityUpdate();

/* SCROLLYTELLING */

const scroller=scrollama();

function moveMapToChapter(chapter){
  if(!chapter?.location)return;

  map.flyTo({
    ...getResponsiveLocation(chapter.location),
    duration:1800,
    essential:true
  });
}

scroller
  .setup({
    step:".step, .map-breathing-space",
    offset:.5
  })
  .onStepEnter(response=>{

    /* EIGHT-VILLAGE OVERVIEW PAUSE */

    if(
      response.element.dataset.id===
      "eight-villages-map-pause"
    ){
      const mobile=window.innerWidth<=700;

      map.flyTo({
        center:[22.910,37.685],
        zoom:mobile?9.8:11.8,
        pitch:mobile?40:55,
        bearing:0,
        duration:1800,
        essential:true
      });

      return;
    }

    const chapter=config.chapters.find(
      item=>item.id===response.element.dataset.id
    );

    moveMapToChapter(chapter);
  });

/* LANGUAGE SWITCH */

function setLanguage(lang){

  const greek=lang==="el"
    ?(config.translations?.el||{})
    :{};

  const site=greek.site||{};

  const localizeAuthorName=value=>{
    if(typeof value!=="string")return value;

    return lang==="el"
      ?value.replace(
          /Christina Maria Carasis/g,
          "Χριστίνα Μαρία Καράση"
        )
      :value;
  };

  document.documentElement.lang=lang;

  document.getElementById("title").textContent=
    lang==="el"
      ?localizeAuthorName(site.title||englishTitle)
      :englishTitle;

  document.getElementById("subtitle").textContent=
    lang==="el"
      ?localizeAuthorName(site.subtitle||config.subtitle)
      :config.subtitle;

  config.chapters.forEach(chapter=>{
    const elements=chapterElements.get(chapter.id);

    if(!elements)return;

    const translation=lang==="el"
      ?(greek.chapters?.[chapter.id]||{})
      :{};

    elements.heading.textContent=
      localizeAuthorName(
        translation.title||chapter.title||""
      );

    elements.paragraph.textContent=
      localizeAuthorName(
        translation.description||chapter.description||""
      );
  });

  /* ARCGIS MAP */

  document.querySelectorAll("[data-geography-i18n]")
    .forEach(element=>{
      element.textContent=
        geographyTranslations[lang][
          element.dataset.geographyI18n
        ];
    });

  const geographyImage=
    document.querySelector(".geography-image");

  if(geographyImage){
    geographyImage.alt=geographyTranslations[lang].alt;
  }

  /* XELI PHOTO */

  document.querySelectorAll("[data-photo-i18n]")
    .forEach(element=>{
      element.textContent=
        photoTranslations[lang][
          element.dataset.photoI18n
        ];
    });

  /* ROMAN BATHS */

  document.querySelectorAll("[data-ruins-photo-i18n]")
    .forEach(element=>{
      element.textContent=
        ruinsPhotoTranslations[lang][
          element.dataset.ruinsPhotoI18n
        ];
    });

  /* BRIDGES */

  document.querySelectorAll("[data-bridges-photo-i18n]")
    .forEach(element=>{
      element.textContent=
        bridgesPhotoTranslations[lang][
          element.dataset.bridgesPhotoI18n
        ];
    });

  /* ABOUT */

  document.querySelectorAll("[data-about-i18n]")
    .forEach(element=>{
      element.textContent=
        aboutTranslations[lang][
          element.dataset.aboutI18n
        ];
    });

  /* MARIA'S MAP */

  document.querySelectorAll("[data-map-i18n]")
    .forEach(element=>{
      const key=element.dataset.mapI18n;

      element.textContent=key==="caption"
        ?mariaNarrative[lang]
        :mapTranslations[lang][key];
    });

  mapDialog.querySelector(".close-map").textContent=
    mapTranslations[lang].close;

  if(mapOpenButton){
    mapOpenButton.setAttribute(
      "aria-label",
      mapTranslations[lang].open
    );
  }

  /* FUTURE CHAPTERS */

  const futureChapters=[
    {
      key:"chapter5",
      matches:/folk traditions|λαϊκ[έε]ς παραδόσεις/i
    },
    {
      key:"chapter6",
      matches:/the future|το μέλλον/i
    }
  ];

  futureChapters.forEach(({key,matches})=>{
    const link=document.querySelector(
      `[data-nav="${key}"]`
    );

    const chapter=config.chapters.find(item=>
      matches.test(item.title||"")||
      matches.test(
        config.translations?.el?.chapters?.[item.id]?.title||""
      )
    );

    if(link){
      link.hidden=!chapter;

      if(chapter){
        link.href=`#${chapter.id}`;
      }
    }
  });

  /* NAVIGATION TRANSLATIONS */

  document.querySelectorAll("[data-nav]")
    .forEach(link=>{
      link.textContent=
        navLabels[lang][link.dataset.nav];
    });

  document.getElementById("menu-label").textContent=
    lang==="el"?"Μενού":"Menu";

  document.querySelectorAll(".language-button")
    .forEach(button=>{
      button.setAttribute(
        "aria-pressed",
        String(button.dataset.lang===lang)
      );
    });

  try{
    localStorage.setItem(
      "arvanitochoria-language",
      lang
    );
  }catch(_){}

  requestAnimationFrame(()=>{
    scroller.resize();
    requestVisibilityUpdate();
  });
}

/* DROPDOWN NAVIGATION */

const menuToggle=document.getElementById("menu-toggle");
const navLinks=document.getElementById("nav-links");

function closeMenu(){
  navLinks.classList.remove("open");
  menuToggle.setAttribute("aria-expanded","false");
}

menuToggle.addEventListener("click",()=>{
  const open=navLinks.classList.toggle("open");

  menuToggle.setAttribute(
    "aria-expanded",
    String(open)
  );
});

document.querySelectorAll('.nav-link[href^="#"]')
  .forEach(link=>{
    link.addEventListener("click",event=>{
      event.preventDefault();

      const id=link.getAttribute("href").slice(1);
      const target=document.getElementById(id);

      if(!target)return;

      closeMenu();

      target.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

      moveMapToChapter(
        config.chapters.find(
          chapter=>chapter.id===id
        )
      );

      if(history.replaceState){
        history.replaceState(null,"",`#${id}`);
      }
    });
  });

document.querySelectorAll(".nav-link")
  .forEach(link=>{
    link.addEventListener("click",closeMenu);
  });

document.addEventListener("keydown",event=>{
  if(event.key==="Escape")closeMenu();
});

document.addEventListener("click",event=>{
  if(!document.getElementById("top-nav").contains(event.target)){
    closeMenu();
  }
});

document.querySelectorAll(".language-button")
  .forEach(button=>{
    button.addEventListener("click",()=>{
      setLanguage(button.dataset.lang);
    });
  });

/* INITIAL LANGUAGE */

let initialLanguage="en";

try{
  if(localStorage.getItem("arvanitochoria-language")==="el"){
    initialLanguage="el";
  }
}catch(_){}

setLanguage(initialLanguage);

/* RESPONSIVE UPDATES */

window.addEventListener("resize",()=>{
  map.resize();
  scroller.resize();
  requestVisibilityUpdate();
});

</script>
