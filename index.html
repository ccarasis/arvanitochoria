<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mt. Arachnaio Arvanite Oral Histories</title>
  
  <!-- Mapbox GL JS CSS & JavaScript -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    
    /* Top Bar Header */
    #top-bar { height: 50px; background-color: #2c3e50; color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; }
    #top-bar h1 { font-size: 1.1rem; margin: 0; }
    .lang-btn { background: #34495e; color: white; border: 1px solid #7f8c8d; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .lang-btn:hover { background: #1abc9c; }

    /* Main Container Layout */
    #container { display: flex; flex: 1; position: relative; overflow: hidden; }
    
    /* Theme Sidebar */
    #sidebar { width: 300px; background: #f8f9fa; border-right: 1px solid #dee2e6; overflow-y: auto; padding: 15px; box-sizing: border-box; z-index: 2; }
    .theme-btn { width: 100%; text-align: left; background: white; border: 1px solid #ced4da; padding: 12px; margin-bottom: 8px; border-radius: 6px; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
    .theme-btn:hover { background: #e9ecef; border-color: #adb5bd; transform: translateY(-1px); }

    /* 3D Map Area */
    #map { flex: 1; height: 100%; }

    /* Video Popup Styling */
    .mapboxgl-popup-content { max-width: 300px; padding: 15px; border-radius: 8px; }
    .video-box { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-top: 10px; border-radius: 4px; }
    .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    /* Mobile Responsive Layout */
    @media (max-width: 768px) {
      #container { flex-direction: column-reverse; }
      #sidebar { width: 100%; height: 180px; }
      #map { height: calc(100% - 180px); }
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Language Toggle -->
  <div id="top-bar">
    <h1 id="title-text">Mt. Arachnaio Arvanite Oral Histories</h1>
    <button class="lang-btn" onclick="toggleLanguage()">Language: <span id="lang-label">EN</span></button>
  </div>

  <div id="container">
    <!-- Thematic Navigation Sidebar -->
    <div id="sidebar">
      <h3 style="margin-top:0;" id="sidebar-heading">Themes</h3>
      <button class="theme-btn" onclick="flyToLocation(22.964, 37.632, 14, 60, -20, 'Arachnaio (Cheli)', 'Pastoral Life & Transhumance')">
        🌾 <span class="theme-label" data-en="Agriculture & Pastoral Life" data-el="Γεωργία & Κτηνοτροφία">Agriculture & Pastoral Life</span>
      </button>
      <button class="theme-btn" onclick="flyToLocation(22.883, 37.714, 14.5, 50, 10, 'Limnes School Path', 'Walking to School in Childhood')">
        🏫 <span class="theme-label" data-en="Education & Walking Paths" data-el="Εκπαίδευση & Μονοπάτια">Education & Walking Paths</span>
      </button>
      <button class="theme-btn" onclick="flyToLocation(22.955, 37.638, 15, 65, 30, 'Kephalovryso Spring', 'Mountain Water & Gathering')">
        💧 <span class="theme-label" data-en="Mountain Water & Springs" data-el="Νερό & Πηγές Βουνού">Mountain Water & Springs</span>
      </button>
      <!-- Additional themes can be added here -->
    </div>

    <!-- 3D Mapbox Map -->
    <div id="map"></div>
  </div>

  <script>
    // Public Mapbox Access Token
    mapboxgl.accessToken = 'pk.eyJ1IjoibWFwYm94IiwiYSI6ImNpejY4M29iazA2Z2gycXA4N2pmbDZmangifQ.-g_vE53SD2WrJ6tFX7QHmA';

    // Initialize 3D Map over Mt. Arachnaio
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/satellite-streets-v12',
      center: [22.968, 37.638], // Mt. Arachnaio coordinates
      zoom: 11.5,
      pitch: 55, // 3D Camera Tilt
      bearing: -15
    });

    // Add 3D Terrain Terrain Dem on load
    map.on('load', () => {
      map.addSource('mapbox-dem', {
        'type': 'raster-dem',
        'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
        'tileSize': 512,
        'maxzoom': 14
      });
      map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.3 });
    });

    let currentPopup = null;

    // Fly Map to Specific Theme Location & Open Video Popup
    function flyToLocation(lng, lat, zoom, pitch, bearing, title, desc) {
      if (currentPopup) currentPopup.remove();

      map.flyTo({
        center: [lng, lat],
        zoom: zoom,
        pitch: pitch,
        bearing: bearing,
        duration: 2500,
        essential: true
      });

      // Video Popup Template (Placeholder YouTube Video)
      const popupHTML = `
        <h4 style="margin:0 0 5px 0;">${title}</h4>
        <p style="margin:0 0 8px 0; font-size:0.85rem; color:#555;">${desc}</p>
        <div class="video-box">
          <iframe src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
        </div>
      `;

      currentPopup = new mapboxgl.Popup({ offset: 25 })
        .setLngLat([lng, lat])
        .setHTML(popupHTML)
        .addTo(map);
    }

    // Basic Language Toggle Logic
    let currentLang = 'EN';
    function toggleLanguage() {
      currentLang = currentLang === 'EN' ? 'EL' : 'EN';
      document.getElementById('lang-label').innerText = currentLang;
      document.getElementById('title-text').innerText = currentLang === 'EN' ? 'Mt. Arachnaio Arvanite Oral Histories' : 'Προφορικές Ιστορίες Αρβανιτών Αραχναίου';
      document.getElementById('sidebar-heading').innerText = currentLang === 'EN' ? 'Themes' : 'Θεματικές';

      document.querySelectorAll('.theme-label').forEach(el => {
        el.innerText = el.getAttribute(`data-${currentLang.toLowerCase()}`);
      });
    }
  </script>
</body>
</html>
