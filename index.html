<div id="map"></div>

<div id="story">

    <div id="header"></div>

    <div id="sections"></div>

    <div id="footer"></div>

</div>


<script src="./config.js"></script>

<script>

    mapboxgl.accessToken = config.accessToken;


    /* =====================================================
       CREATE MAP
       ===================================================== */

    var firstChapter = config.chapters[0];

    var map = new mapboxgl.Map({
        container: "map",
        style: config.style,

        center: firstChapter.location.center,
        zoom: firstChapter.location.zoom,

        pitch: firstChapter.location.pitch || 0,
        bearing: firstChapter.location.bearing || 0,

        interactive: false,

        // Helps prevent unnecessary rendering issues
        antialias: true
    });


    /* =====================================================
       MAP LOAD
       ===================================================== */

    map.on("load", function () {

        /*
         * Let Mapbox establish the correct canvas size.
         */
        map.resize();


        /* -------------------------------------------------
           TERRAIN
           ------------------------------------------------- */

        if (config.use3dTerrain) {

            map.addSource("mapbox-dem", {
                type: "raster-dem",
                url: "mapbox://mapbox.mapbox-terrain-dem-v1",
                tileSize: 512,
                maxzoom: 14
            });

            map.setTerrain({
                source: "mapbox-dem",
                exaggeration: 1.0
            });
        }


        /*
         * One more resize after the browser has completed
         * layout. This is safe; unlike forcing the canvas
         * dimensions with CSS, Mapbox handles the resize.
         */
        requestAnimationFrame(function () {
            map.resize();
        });
    });


    /* =====================================================
       HEADER CONTENT
       ===================================================== */

    var header = document.getElementById("header");

    if (config.title) {

        var title = document.createElement("h1");
        title.innerHTML = config.title;

        header.appendChild(title);
    }

    if (config.subtitle) {

        var subtitle = document.createElement("h2");
        subtitle.innerText = config.subtitle;

        header.appendChild(subtitle);
    }

    if (config.byline) {

        var byline = document.createElement("p");
        byline.innerHTML = config.byline;

        header.appendChild(byline);
    }


    /* =====================================================
       STORY CHAPTERS
       ===================================================== */

    var sections = document.getElementById("sections");

    config.chapters.forEach(function (record) {

        var container = document.createElement("div");

        container.className = "step";
        container.id = record.id;


        var chapterCard = document.createElement("div");


        if (record.title) {

            var title = document.createElement("h3");

            title.innerText = record.title;

            chapterCard.appendChild(title);
        }


        if (record.description) {

            var description = document.createElement("p");

            description.innerHTML = record.description;

            chapterCard.appendChild(description);
        }


        container.appendChild(chapterCard);

        sections.appendChild(container);
    });


    /* =====================================================
       FOOTER
       ===================================================== */

    document.getElementById("footer").innerText =
        config.footer || "";


    /* =====================================================
       SCROLLAMA
       ===================================================== */

    var scroller = scrollama();

    scroller
        .setup({
            step: ".step",
            offset: 0.5,
            debug: false
        })
        .onStepEnter(function (response) {

            var chapter = config.chapters.find(function (chap) {

                return chap.id === response.element.id;

            });


            if (!chapter) {
                return;
            }


            /*
             * Use the chapter's camera settings directly.
             * Mapbox handles the transition and terrain.
             */
            map.flyTo({
                center: chapter.location.center,
                zoom: chapter.location.zoom,
                bearing: chapter.location.bearing || 0,
                pitch: chapter.location.pitch || 0,

                essential: true,

                duration: chapter.location.duration || 2000
            });

        });


    /* =====================================================
       RESIZE
       ===================================================== */

    function handleResize() {

        map.resize();

        scroller.resize();
    }


    window.addEventListener("resize", handleResize);

    window.addEventListener("orientationchange", function () {

        setTimeout(handleResize, 250);

    });

</script>
