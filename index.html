<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Arvanitochoria Scrollytelling</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/scrollama"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; }
        
        /* Map positioning fixes */
        #map { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* Story Container */
        #story { position: relative; z-index: 2; pointer-events: none; }
        
        /* FULL SCREEN WIDTH HEADER */
        #header { 
            width: 100vw; 
            max-width: 100%;
            padding: 40px 20px; 
            margin: 0 0 50vh 0; 
            text-align: center; 
            background: rgba(20, 15, 10, 0.92); 
            border-bottom: 2px solid #5a402d; 
            pointer-events: auto; 
        }
        #header img { 
            width: 100%; 
            max-width: 900px; 
            height: 250px; 
            object-fit: cover; 
            border-radius: 8px; 
            margin-bottom: 20px; 
        }
        #header h1 { margin: 10px 0; font-size: 2.5rem; }
        #header h2 { margin: 5px 0 15px 0; font-size: 1.2rem; font-weight: 300; opacity: 0.9; }
        #header p { margin: 0; font-size: 0.95rem; opacity: 0.8; line-height: 1.5; }

        /* Chapter cards */
        .step { padding: 25vh 20px; max-width: 480px; margin: 0 auto; pointer-events: auto; }
        .step div { padding: 25px; background: rgba(15, 15, 15, 0.88); border-radius: 8px; font-size: 1rem; line-height: 1.6; border: 1px solid rgba(255,255,255,0.1); }
        #footer { padding: 40px 20px; text-align: center; font-size: 0.9rem; background: rgba(0,0,0,0.85); pointer-events: auto; }
    </style>
</head>
<body>

<div id="map"></div>
<div id="story">
    <div id="header"></div>
    <div id="sections"></div>
    <div id="footer"></div>
</div>

<script src="./config.js"></script>
<script>
    mapboxgl.accessToken = config.accessToken;

    // Initialize Map flat first to eliminate WebGL camera distortion
    var map = new mapboxgl.Map({
        container: 'map',
        style: config.style,
        center: config.chapters[0].location.center,
        zoom: config.chapters[0].location.zoom,
        bearing: 0,
        pitch: 0,
        interactive: false,
        preserveDrawingBuffer: true
    });

    // Resize map immediately when window loads
    window.addEventListener('load', function() {
        map.resize();
    });

    map.on('load', function() {
        map.resize();
        
        // Add 3D Terrain safely
        if (config.use3dTerrain) {
            map.addSource('mapbox-dem', {
                'type': 'raster-dem',
                'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
                'tileSize': 512,
                'maxzoom': 14
            });
            map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });
        }

        // Apply pitch/tilt smoothly after engine stabilizes
        setTimeout(function() {
            map.resize();
            map.easeTo({
                pitch: config.chapters[0].location.pitch || 60,
                bearing: config.chapters[0].location.bearing || 0,
                duration: 1000
            });
        }, 500);
    });

    // Render Full-Width Header
    var header = document.getElementById('header');
    if (config.title) {
        var title = document.createElement('h1');
        title.innerHTML = config.title;
        header.appendChild(title);
    }
    if (config.subtitle) {
        var subtitle = document.createElement('h2');
        subtitle.innerText = config.subtitle;
        header.appendChild(subtitle);
    }
    if (config.byline) {
        var byline = document.createElement('p');
        byline.innerHTML = config.byline;
        header.appendChild(byline);
    }

    // Render Chapters
    var sections = document.getElementById('sections');
    config.chapters.forEach(function(record) {
        var container = document.createElement('div');
        container.className = 'step';
        container.id = record.id;
        
        var chapterCard = document.createElement('div');
        if (record.title) {
            var title = document.createElement('h3');
            title.innerText = record.title;
            chapterCard.appendChild(title);
        }
        if (record.description) {
            var desc = document.createElement('p');
            desc.innerHTML = record.description;
            chapterCard.appendChild(desc);
        }
        container.appendChild(chapterCard);
        sections.appendChild(container);
    });

    document.getElementById('footer').innerText = config.footer || '';

    // Scrollama Setup
    var scroller = scrollama();
    scroller.setup({ step: '.step', offset: 0.5 }).onStepEnter(function(response) {
        var chapter = config.chapters.find(function(chap) { return chap.id === response.element.id; });
        if (chapter) {
            map.flyTo(chapter.location);
        }
    });

    window.addEventListener('resize', function() {
        map.resize();
        scroller.resize();
    });
</script>
</body>
</html>
