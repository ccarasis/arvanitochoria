<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>Mapbox Storytelling</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <script src="https://unpkg.com/scrollama"></script>
    <style>
        body { margin:0; padding:0; font-family: sans-serif; background: #1a1a1a; color: #fff; }
        #map { position: fixed; top:0; bottom:0; width:100%; z-index: 1; }
        #story { position: relative; z-index: 2; pointer-events: none; }
        #header { padding: 100px 20px 80px 20px; max-width: 600px; margin: 0 auto 50vh auto; text-align: center; background: rgba(0,0,0,0.8); border-radius: 8px; pointer-events: auto; }
        .step { padding: 20vh 0; max-width: 500px; margin: 0 auto; pointer-events: auto; }
        .step-content { background: rgba(0,0,0,0.8); padding: 25px; border-radius: 8px; }
        .step-content img { width: 100%; max-height: 250px; object-fit: cover; }
        #footer { padding: 40px 20px; text-align: center; font-size: 0.85rem; background: #000; position: relative; z-index: 2; pointer-events: auto; }
        .left { margin-left: 10vw; }
        .right { margin-left: auto; margin-right: 10vw; }
        .centered { margin: 0 auto; }
    </style>
</head>
<body>

<div id="map"></div>
<div id="story">
    <div id="header">
        <h1 id="title"></h1>
        <h2 id="subtitle"></h2>
        <p id="byline"></p>
    </div>
    <div id="features"></div>
    <div id="footer"></div>
</div>

<!-- THIS LINE LOADS YOUR CONFIG DATA INTO THE HTML -->
<script src="./config.js"></script>

<script>
document.getElementById('title').innerText = config.title;
document.getElementById('subtitle').innerText = config.subtitle;
document.getElementById('byline').innerHTML = config.byline;
document.getElementById('footer').innerText = config.footer;

var features = document.getElementById('features');
config.chapters.forEach((record) => {
    var div = document.createElement('div');
    div.className = 'step ' + record.alignment;
    div.id = record.id;
    var content = document.createElement('div');
    content.className = 'step-content';
    if (record.title) {
        var title = document.createElement('h3');
        title.innerText = record.title;
        content.appendChild(title);
    }
    if (record.image) {
        var img = document.createElement('img');
        img.src = record.image;
        content.appendChild(img);
    }
    if (record.description) {
        var p = document.createElement('p');
        p.innerHTML = record.description;
        content.appendChild(p);
    }
    div.appendChild(content);
    features.appendChild(div);
});

mapboxgl.accessToken = config.accessToken;
var map = new mapboxgl.Map({
    container: 'map',
    style: config.style,
    center: config.chapters[0].location.center,
    zoom: config.chapters[0].location.zoom,
    bearing: config.chapters[0].location.bearing,
    pitch: config.chapters[0].location.pitch,
    interactive: false
});

map.on('style.load', function() {
    if (config.use3dTerrain) {
        map.addSource('mapbox-dem', {
            'type': 'raster-dem',
            'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
            'tileSize': 512,
            'maxzoom': 14
        });
        map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });
    }
});

var scroller = scrollama();
scroller
    .setup({ step: '.step', offset: 0.5, progress: true })
    .onStepEnter(response => {
        var chapter = config.chapters.find(chap => chap.id === response.element.id);
        if (chapter) {
            map[chapter.mapAnimation || 'flyTo'](chapter.location);
        }
    });

window.addEventListener('resize', scroller.resize);
</script>
</body>
</html>
