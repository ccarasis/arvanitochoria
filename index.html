<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <title>Arvanitochoria</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    >

    <!-- =====================================================
         MAPBOX
         ===================================================== -->

    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

    <link
        href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         SCROLLAMA
         ===================================================== -->

    <script src="https://unpkg.com/scrollama"></script>


    <style>

        /* =====================================================
           GLOBAL
           ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #000;
            color: #fff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            overflow-x: hidden;
        }


        /* =====================================================
           MAP
           ===================================================== */

        #map {

            position: fixed;

            top: 0;
            right: 0;
            bottom: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 1;
        }

        /*
         * IMPORTANT:
         *
         * Do NOT set dimensions on .mapboxgl-canvas.
         * Mapbox controls its own WebGL canvas.
         */


        /* =====================================================
           STORY
           ===================================================== */

        #story {

            position: relative;

            width: 100%;

            z-index: 2;

            pointer-events: none;
        }


        /* =====================================================
           HEADER / HERO
           ===================================================== */

        #header {
    position: relative;
    height: 480px;
    overflow: hidden;
    color: white;
}

.header-content {
    position: absolute;
    left: 50%;
    top: 225px;
    transform: translateX(-50%);
    width: 90%;
    text-align: center;
    z-index: 2;
}


        /*
         * PHOTO
         *
         * The image is contained inside config.title,
         * so we style the image that JavaScript inserts.
         */

        #header img {

            position: absolute;

            top: 0;
            left: 0;

            display: block;

            width: 100%;
            height: 430px;

            margin: 0;

            object-fit: cover;

            object-position: center;

            border-radius: 0;

            z-index: 0;
        }


        /*
         * DARK GRADIENT
         *
         * This sits over the photograph and underneath
         * the title text.
         *
         * It makes the text readable without putting
         * a solid black box over the image.
         */

        #header::after {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    to bottom,
                    rgba(20, 12, 7, 0.70) 0%,
                    rgba(20, 12, 7, 0.25) 38%,
                    rgba(20, 12, 7, 0.35) 58%,
                    rgba(20, 12, 7, 0.88) 100%
                );

            z-index: 1;

            pointer-events: none;
        }


        /*
         * TITLE
         */

        #header h1 {

            position: relative;

            z-index: 2;

            margin: 0;

            padding: 270px 20px 0 20px;

            font-size: 3.2rem;

            line-height: 1.05;

            font-weight: 700;

            letter-spacing: 0.01em;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.95),
                0 4px 18px rgba(0, 0, 0, 0.85);
        }


        /*
         * SUBTITLE
         */

        #header h2 {

            position: relative;

            z-index: 2;

            margin: 10px 0 0 0;

            padding: 0 25px;

            font-size: 1.25rem;

            line-height: 1.4;

            font-weight: 400;

            opacity: 0.98;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.95),
                0 3px 12px rgba(0, 0, 0, 0.8);
        }


        /*
         * BYLINE
         */

        #header p {

            position: relative;

            z-index: 2;

            margin: 12px 0 0 0;

            padding: 0 25px;

            font-size: 0.9rem;

            line-height: 1.55;

            font-weight: 400;

            opacity: 0.92;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.95),
                0 3px 12px rgba(0, 0, 0, 0.8);
        }


        /* =====================================================
           CHAPTER SECTIONS
           ===================================================== */

        #sections {

            width: 100%;
        }


        .step {

            width: 100%;

            max-width: 500px;

            margin: 0 auto;

            padding: 25vh 20px;

            pointer-events: auto;
        }


        /*
         * BROWN STORY CARD
         */

        .step div {

            padding: 25px;

            background: rgba(70, 45, 29, 0.95);

            border:
                1px solid
                rgba(196, 155, 108, 0.45);

            border-radius: 8px;

            font-size: 1rem;

            line-height: 1.6;

            color: #fff;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.45);
        }


        .step h3 {

            margin-top: 0;
            margin-bottom: 12px;

            font-size: 1.35rem;

            line-height: 1.25;

            font-weight: 600;
        }


        .step p {

            margin-top: 0;
            margin-bottom: 0;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        #footer {

            width: 100%;

            padding: 40px 20px;

            text-align: center;

            font-size: 0.85rem;

            line-height: 1.5;

            color: rgba(255, 255, 255, 0.8);

            background: rgba(35, 23, 16, 0.95);

            border-top:
                1px solid
                rgba(196, 155, 108, 0.3);

            pointer-events: auto;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            #header {

                height: 380px;

                margin-bottom: 30vh;
            }


            #header img {

                height: 380px;
            }


            #header h1 {

                padding-top: 220px;

                font-size: 2.25rem;
            }


            #header h2 {

                font-size: 1.05rem;
            }


            #header p {

                font-size: 0.82rem;
            }


            .step {

                padding: 20vh 15px;
            }


            .step div {

                padding: 20px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         MAP
         ===================================================== -->

    <div id="map"></div>


    <!-- =====================================================
         STORY
         ===================================================== -->

    <div id="story">

        <div id="header"></div>

        <div id="sections"></div>

        <div id="footer"></div>

    </div>


    <!-- =====================================================
         CONFIG
         ===================================================== -->

    <script src="./config.js"></script>


    <script>

        /* =====================================================
           MAPBOX ACCESS TOKEN
           ===================================================== */

        mapboxgl.accessToken = config.accessToken;


        /* =====================================================
           FIRST CHAPTER
           ===================================================== */

        var firstChapter = config.chapters[0];


        /* =====================================================
           CREATE MAP
           ===================================================== */

        var map = new mapboxgl.Map({

            container: "map",

            style: config.style,

            center: firstChapter.location.center,

            zoom: firstChapter.location.zoom,

            /*
             * Start flat.
             *
             * Scrollama will move the map to each chapter's
             * pitch when that chapter is reached.
             */

            pitch: 0,

            bearing: 0,

            interactive: false

        });


        /* =====================================================
           MAP LOAD
           ===================================================== */

        map.on("load", function () {

            /*
             * Make absolutely sure terrain is disabled.
             *
             * This protects against terrain being present
             * in the Mapbox Studio style itself.
             */

            if (map.getTerrain()) {

                map.setTerrain(null);

            }


            /*
             * Make sure Mapbox knows the actual dimensions
             * of its container.
             */

            map.resize();

        });


        /* =====================================================
           HEADER
           ===================================================== */

        var header =
            document.getElementById("header");


        /*
         * Your config.title contains:
         *
         * <img src="./assets/IMG_3358.jpeg">
         * <br>
         * Arvanitochoria
         *
         * We need to extract the image and create the
         * title separately so the layout works correctly.
         */

        if (config.title) {

            var titleHTML = config.title;


            /*
             * Find an image inside the title.
             */

            var imageMatch =
                titleHTML.match(/<img[^>]+src=["']([^"']+)["'][^>]*>/i);


            if (imageMatch) {

                var image =
                    document.createElement("img");

                image.src =
                    imageMatch[1];

                image.alt =
                    "Arvanitochoria";

                header.appendChild(image);


                /*
                 * Remove the image from the title text.
                 */

                titleHTML =
                    titleHTML.replace(
                        imageMatch[0],
                        ""
                    );
            }


            /*
             * Remove the <br> that was originally between
             * the image and title.
             */

            titleHTML =
                titleHTML.replace(
                    /<br\s*\/?>/gi,
                    ""
                );


            /*
             * Create title.
             */

            var title =
                document.createElement("h1");

            title.innerHTML =
                titleHTML.trim();

            header.appendChild(title);
        }


        /* =====================================================
           SUBTITLE
           ===================================================== */

        if (config.subtitle) {

            var subtitle =
                document.createElement("h2");

            subtitle.innerText =
                config.subtitle;

            header.appendChild(subtitle);
        }


        /* =====================================================
           BYLINE
           ===================================================== */

        if (config.byline) {

            var byline =
                document.createElement("p");

            byline.innerHTML =
                config.byline;

            header.appendChild(byline);
        }


        /* =====================================================
           CHAPTERS
           ===================================================== */

        var sections =
            document.getElementById("sections");


        config.chapters.forEach(function (record) {

            /*
             * Chapter wrapper
             */

            var container =
                document.createElement("div");

            container.className =
                "step";

            container.id =
                record.id;


            /*
             * Chapter card
             */

            var chapterCard =
                document.createElement("div");


            /*
             * Chapter title
             */

            if (record.title) {

                var title =
                    document.createElement("h3");

                title.innerText =
                    record.title;

                chapterCard.appendChild(title);
            }


            /*
             * Chapter description
             */

            if (record.description) {

                var description =
                    document.createElement("p");

                description.innerHTML =
                    record.description;

                chapterCard.appendChild(description);
            }


            container.appendChild(
                chapterCard
            );


            sections.appendChild(
                container
            );

        });


        /* =====================================================
           FOOTER
           ===================================================== */

        document.getElementById("footer").innerText =
            config.footer || "";


        /* =====================================================
           SCROLLAMA
           ===================================================== */

        var scroller =
            scrollama();


        scroller

            .setup({

                step: ".step",

                offset: 0.5,

                debug: false

            })


            .onStepEnter(function (response) {

                /*
                 * Find the chapter corresponding to the
                 * section currently entering the viewport.
                 */

                var chapter =
                    config.chapters.find(function (chap) {

                        return chap.id ===
                            response.element.id;

                    });


                if (!chapter) {

                    return;

                }


                /*
                 * Move the camera to the chapter.
                 */

                map.flyTo({

                    center:
                        chapter.location.center,

                    zoom:
                        chapter.location.zoom,

                    pitch:
                        chapter.location.pitch || 0,

                    bearing:
                        chapter.location.bearing || 0,

                    duration:
                        chapter.location.duration || 2000,

                    essential: true

                });

            });


        /* =====================================================
           RESIZE
           ===================================================== */

        function handleResize() {

            map.resize();

            scroller.resize();

        }


        window.addEventListener(
            "resize",
            handleResize
        );


        window.addEventListener(
            "orientationchange",
            function () {

                setTimeout(
                    handleResize,
                    250
                );

            }
        );

    </script>

</body>

</html>
