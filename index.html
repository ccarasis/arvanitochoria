<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Arvanitochoria</title>


  <!-- Mapbox -->

  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.css"
    rel="stylesheet"
  >

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.js"></script>


  <!-- Scrollama -->

  <script src="https://unpkg.com/scrollama"></script>


  <!-- Story configuration -->

  <script src="./config.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
    }


    /* MAP */

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }


    /* STORY */

    #story {
      position: relative;
      z-index: 2;
    }


    /* HEADER */

    #header {
      position: relative;
      height: 400px;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    #header-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: -2;
    }

    #header::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.25),
          rgba(0, 0, 0, 0.55) 55%,
          rgba(0, 0, 0, 0.85)
        );

      z-index: -1;
    }

    #header-content {
      width: min(1000px, 90%);

      margin-top: 40px;

      text-shadow:
        0 3px 8px rgba(0, 0, 0, 0.9);
    }

    #title {
      margin: 0;

      font-size: clamp(50px, 7vw, 105px);

      line-height: 1;

      font-weight: 400;
    }

    #subtitle {
      margin-top: 20px;

      font-size: clamp(25px, 3vw, 42px);

      line-height: 1.2;
    }

    #byline {
      margin-top: 30px;

      font-family: Arial, sans-serif;

      font-size: 15px;

      line-height: 1.5;
    }


    /* CHAPTERS */

    .step {
      min-height: 100vh;

      display: flex;

      align-items: center;

      padding: 80px 5vw;
    }

    .step.left {
      justify-content: flex-start;
    }

    .step.right {
      justify-content: flex-end;
    }

    .step-content {
      width: min(590px, 88vw);

      padding: 34px 40px;

      background: rgba(70, 43, 27, 0.94);

      border-radius: 4px;

      box-shadow:
        0 5px 25px rgba(0, 0, 0, 0.35);
    }

    .step-content h2 {
      margin: 0 0 22px;

      font-size: 34px;

      line-height: 1.15;

      font-weight: 400;
    }

    .step-content p {
      margin: 0;

      font-family: Arial, sans-serif;

      font-size: 20px;

      line-height: 1.65;
    }


    /* VIDEO */

    .video-step {
      position: relative;

      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;

      z-index: 5;
    }

    .video-container {
      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background: #000;
    }

    .video-container iframe {
      position: absolute;

      top: 50%;
      left: 50%;

      width: 100vw;
      height: 56.25vw;

      min-height: 100vh;
      min-width: 177.78vh;

      transform: translate(-50%, -50%);

      border: 0;
    }


    /* MOBILE */

    @media (max-width: 700px) {

      #header {
        height: 620px;
      }

      #title {
        font-size: 52px;
      }

      #subtitle {
        font-size: 24px;
      }

      #byline {
        font-size: 17px;
      }

      .step {
        padding: 60px 20px;

        justify-content: center !important;
      }

      .step-content {
        padding: 28px;
      }

      .step-content h2 {
        font-size: 28px;
      }

      .step-content p {
        font-size: 18px;
      }

    }

  </style>

</head>


<body>


  <!-- MAP -->

  <div id="map"></div>


  <!-- STORY -->

  <main id="story">


    <!-- TITLE -->

    <header id="header">

      <div id="header-content">

        <h1 id="title"></h1>

        <div id="subtitle"></div>

        <div id="byline"></div>

      </div>

    </header>


    <!-- CHAPTERS -->

    <section id="chapters"></section>


  </main>


  <script>

    /*
     * MAP
     */

    mapboxgl.accessToken = config.accessToken;


    const map = new mapboxgl.Map({

      container: "map",

      style: config.style,

      interactive: false

    });


    /*
     * TERRAIN
     *
     * Uses the terrain already configured
     * in the Mapbox Studio style.
     */

    map.on("style.load", () => {

      const terrain = map.getStyle().terrain;

      if (terrain) {
        map.setTerrain(terrain);
      }

      const firstChapter = config.chapters[0];

      if (firstChapter && firstChapter.location) {

        map.jumpTo({
          center: firstChapter.location.center,
          zoom: firstChapter.location.zoom,
          pitch: firstChapter.location.pitch ?? 0,
          bearing: firstChapter.location.bearing ?? 0
        });

      }

    });


    /*
     * HEADER IMAGE
     */

    const titleImage =
      config.title.match(
        /<img[^>]+src=["']([^"']+)["']/i
      );


    if (titleImage) {

      const image =
        document.createElement("img");

      image.id = "header-image";

      image.src = titleImage[1];

      document
        .getElementById("header")
        .prepend(image);


      document.getElementById("title")
        .textContent =
        config.title
          .replace(/<img[^>]*>/i, "")
          .replace(/<br\s*\/?>/gi, "")
          .trim();

    }

    else {

      document.getElementById("title")
        .textContent =
        config.title;

    }


    document.getElementById("subtitle")
      .textContent =
      config.subtitle;


    document.getElementById("byline")
      .innerHTML =
      config.byline;


    /*
     * BUILD CHAPTERS
     *
     * Chapter 0 is camera-only.
     * It controls the opening map position
     * but does not create a visible story box.
     */

    const chapters =
      document.getElementById("chapters");


    config.chapters.forEach((chapter) => {

      if (chapter.id === "chapter-0") {
        return;
      }


      const section =
        document.createElement("section");


      section.className =
        `step ${chapter.alignment || "left"}`;


      section.dataset.id =
        chapter.id;


      section.innerHTML = `

        <div class="step-content">

          <h2>${chapter.title}</h2>

          <p>${chapter.description}</p>

        </div>

      `;


      chapters.appendChild(section);

    });


    /*
     * VIDEO SECTION
     *
     * This appears after the final chapter.
     * The YouTube video is loaded only when
     * the reader reaches this section.
     */

    const videoSection =
      document.createElement("section");

    videoSection.className =
      "video-step";

    videoSection.dataset.id =
      "ra-kampana-video";


    videoSection.innerHTML = `

      <div class="video-container">

        <iframe
          id="ra-kampana-video"
          data-src="https://www.youtube.com/embed/_My7FpdZFWo?autoplay=1&mute=1&controls=1&playsinline=1&rel=0"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>

      </div>

    `;


    chapters.appendChild(videoSection);


    /*
     * VIDEO CONTROL
     */

    const videoFrame =
      document.getElementById(
        "ra-kampana-video"
      );


    function startVideo() {

      if (!videoFrame.src) {

        videoFrame.src =
          videoFrame.dataset.src;

      }

    }


    function stopVideo() {

      if (videoFrame.src) {

        videoFrame.src = "";

      }

    }


    /*
     * SCROLLAMA
     */

    const scroller =
      scrollama();


    function handleStepEnter(response) {

      const id =
        response.element.dataset.id;


      /*
       * VIDEO STEP
       */

      if (id === "ra-kampana-video") {

        startVideo();

        return;

      }


      /*
       * NORMAL CHAPTER
       */

      const chapter =
        config.chapters.find(
          item =>
            item.id === id
        );


      if (
        !chapter ||
        !chapter.location
      ) {
        return;
      }


      map.flyTo({

        center:
          chapter.location.center,

        zoom:
          chapter.location.zoom,

        pitch:
          chapter.location.pitch ?? 0,

        bearing:
          chapter.location.bearing ?? 0,

        duration: 1800,

        essential: true

      });

    }


    function handleStepExit(response) {

      const id =
        response.element.dataset.id;


      if (id === "ra-kampana-video") {

        stopVideo();

      }

    }


    scroller
      .setup({

        step: ".step, .video-step",

        offset: 0.5

      })

      .onStepEnter(
        handleStepEnter
      )

      .onStepExit(
        handleStepExit
      );


    /*
     * RESIZE
     */

    window.addEventListener(
      "resize",
      () => {

        map.resize();

        scroller.resize();

      }
    );

  </script>


</body>

</html>
