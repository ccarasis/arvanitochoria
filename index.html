<style>

<script>

/* MAPBOX */

mapboxgl.accessToken = config.accessToken;

const map = new mapboxgl.Map({
  container: "map",
  style: config.style,
  interactive: false
});

function getResponsiveLocation(location) {
  let adjustment = 0;

  if (window.innerWidth <= 480) {
    adjustment = -0.8;
  } else if (window.innerWidth <= 700) {
    adjustment = -0.6;
  }

  return {
    center: location.center,
    zoom: location.zoom + adjustment,
    pitch: location.pitch ?? 0,
    bearing: location.bearing ?? 0
  };
}

map.on("style.load", () => {
  const terrain = map.getStyle().terrain;

  if (terrain) {
    map.setTerrain(terrain);
  }

  const first = config.chapters[0];

  if (first?.location) {
    map.jumpTo(getResponsiveLocation(first.location));
  }
});

/* HEADER */

const titleImage = config.title.match(
  /<img[^>]+src=["']([^"']+)["']/i
);

if (titleImage) {
  const image = document.createElement("img");
  image.id = "header-image";
  image.src = titleImage[1];
  image.alt = "Mt. Arachnaio landscape";
  document.getElementById("header").prepend(image);
}

const englishTitle = config.title
  .replace(/<img[^>]*>/i, "")
  .replace(/<br\s*\/?\s*>/gi, "")
  .trim();

/* TRANSLATIONS */

const navLabels = {
  en: {
    chapter1: "Chapter 1: What are the Arvanitochoria?",
    chapter2: "Chapter 2: A Brief History of Mt. Arachnaio",
    chapter3: "Chapter 3: Life on the Mountain",
    chapter4: "Chapter 4: Agriculture & Pastoral Life",
    archive: "Video Archive",
    menu: "Menu ☰"
  },
  el: {
    chapter1: "Κεφάλαιο 1: Τι είναι τα Αρβανιτοχώρια;",
    chapter2: "Κεφάλαιο 2: Μια Σύντομη Ιστορία του Όρους Αραχναίου",
    chapter3: "Κεφάλαιο 3: Η Ζωή στο Βουνό",
    chapter4: "Κεφάλαιο 4: Γεωργία και Κτηνοτροφία",
    archive: "Αρχείο Βίντεο",
    menu: "Μενού ☰"
  }
};

const geographyTranslations = {
  en: {
    title: "Geographic Distribution of Arvanite Settlement Regions in Southern Greece",
    caption: "Map created by Christina Maria Carasis using ArcGIS, referencing settlement data from Lithoxoou (n.d.) and regional ethnolinguistic boundaries from Philippson (1890) and Tsitsipis (1998).",
    alt: "Map of Arvanite settlement regions in Southern Greece",
    legendHeading: "Ethnolinguistic Presence",
    core: "Core Arvanite Regions",
    fieldwork: "Fieldwork Area: Mt. Arachnaio & Argolida/Corinthia",
    blended: "Blended & Low Population Areas"
  },
  el: {
    title: "Γεωγραφική Κατανομή των Περιοχών Αρβανίτικης Εγκατάστασης στη Νότια Ελλάδα",
    caption: "Χάρτης που δημιουργήθηκε από τη Christina Maria Carasis με τη χρήση του ArcGIS, με βάση δεδομένα οικισμών από τον Lithoxoou (χ.χ.) και περιφερειακά εθνογλωσσικά όρια από τους Philippson (1890) και Tsitsipis (1998).",
    alt: "Χάρτης περιοχών αρβανίτικης εγκατάστασης στη Νότια Ελλάδα",
    legendHeading: "Εθνογλωσσική Παρουσία",
    core: "Κύριες Αρβανίτικες Περιοχές",
    fieldwork: "Περιοχή Επιτόπιας Έρευνας: Όρος Αραχναίο και Αργολίδα/Κορινθία",
    blended: "Περιοχές Μικτού και Αραιού Πληθυσμού"
  }
};

const photoTranslations = {
  en: {
    description: "Looking down from Xeli toward the valley, with mountain slopes descending into agricultural lands.",
    credit: "Photograph by Christina Maria Carasis."
  },
  el: {
    description: "Θέα από το Χέλι προς την κοιλάδα, με τις πλαγιές του βουνού να κατηφορίζουν προς τις καλλιεργήσιμες εκτάσεις.",
    credit: "Φωτογραφία: Christina Maria Carasis."
  }
};

const mariaNarrative = {
  en: `Drawn from memory by Maria Mpiniari, this map traces the schools, churches, and pathways connecting the Arvanite villages of Mt. Arachnaio.

Maria's own educational journey began on foot, walking from her home village of Dousia to the neighboring village of Bardi for elementary school. As the only girl in Dousia to continue her education beyond the primary grades, she then traveled by bus to Manesis for middle school, followed by another bus journey into the valley to Merbaka for high school.

Her drawing reveals more than the locations of educational institutions. It offers a personal geography of access to education, illustrating how distance, transportation, and gender shaped opportunities for young people living on the mountain.`,

  el: `Σχεδιασμένος από μνήμης από τη Μαρία Μπινιάρη, αυτός ο χάρτης αποτυπώνει τα σχολεία, τις εκκλησίες και τα μονοπάτια που συνέδεαν τα αρβανιτοχώρια του Όρους Αραχναίου.

Η εκπαιδευτική διαδρομή της Μαρίας ξεκίνησε με τα πόδια, από το χωριό της, τη Ντούσια, προς το γειτονικό Μπάρδι, όπου πήγαινε στο δημοτικό σχολείο. Ως το μοναδικό κορίτσι στη Ντούσια που συνέχισε την εκπαίδευσή του πέρα από το δημοτικό, στη συνέχεια μετακινούνταν με λεωφορείο στο Μάνεση για το γυμνάσιο και με δεύτερο λεωφορείο προς την κοιλάδα, στη Μέρμπακα, για το λύκειο.

Το σχέδιό της αποκαλύπτει περισσότερα από τις θέσεις των εκπαιδευτικών ιδρυμάτων. Προσφέρει μια προσωπική γεωγραφία της πρόσβασης στην εκπαίδευση, δείχνοντας πώς η απόσταση, οι μετακινήσεις και το φύλο διαμόρφωναν τις ευκαιρίες των νέων που ζούσαν στο βουνό.`
};

const mapTranslations = {
  en: {
    title: "Mapping a Journey to Education",
    credit: "Hand-drawn by Maria Mpiniari",
    hint: "Click or tap the map to enlarge",
    close: "Close ×",
    open: "Enlarge Maria Mpiniari's hand-drawn map"
  },
  el: {
    title: "Χαρτογραφώντας τη Διαδρομή προς την Εκπαίδευση",
    credit: "Χειρόγραφος χάρτης της Μαρίας Μπινιάρη",
    hint: "Πατήστε στον χάρτη για μεγέθυνση",
    close: "Κλείσιμο ×",
    open: "Μεγέθυνση του χάρτη της Μαρίας Μπινιάρη"
  }
};

/* BUILD CHAPTERS */

const chaptersContainer = document.getElementById("chapters");
const chapterElements = new Map();

config.chapters.forEach(chapter => {

  if (chapter.id === "chapter-0") return;

  const section = document.createElement("section");
  section.className = `step ${chapter.alignment || "left"}`;
  section.id = chapter.id;
  section.dataset.id = chapter.id;

  const card = document.createElement("div");
  card.className = "step-content";

  const heading = document.createElement("h2");
  const paragraph = document.createElement("p");

  card.append(heading, paragraph);

  if (chapter.videoId) {
    const video = document.createElement("div");
    video.className = "oral-history-video";

    const iframe = document.createElement("iframe");
    iframe.src =
      `https://www.youtube-nocookie.com/embed/${encodeURIComponent(chapter.videoId)}?cc_load_policy=1`;
    iframe.title = "Oral history video";
    iframe.loading = "lazy";
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    iframe.allow =
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    iframe.allowFullscreen = true;

    video.appendChild(iframe);
    card.appendChild(video);
  }

  section.appendChild(card);
  chaptersContainer.appendChild(section);

  chapterElements.set(chapter.id, {
    section,
    heading,
    paragraph
  });

  /* ARCGIS MAP WITH LOWER-LEFT OVERLAY LEGEND */

  if (chapter.id === "chapter-1") {
    const feature = document.createElement("section");
    feature.className = "geography-map-feature";
    feature.id = "arvanite-geography-map";

    feature.innerHTML = `
      <figure>

        <div class="geography-image-container">

          <a
            class="geography-image-link"
            href="./assets/arvanite-geography-map.png"
            target="_blank"
            rel="noopener"
            aria-label="Open full-size Arvanite geography map"
          >
            <img
              class="geography-image"
              src="./assets/arvanite-geography-map.png"
              alt="Map of Arvanite settlement regions in Southern Greece"
              loading="lazy"
            >
          </a>

          <div
            class="geography-legend"
            role="group"
            aria-label="Ethnolinguistic presence legend"
          >

            <strong
              class="geography-legend-heading"
              data-geography-i18n="legendHeading"
            ></strong>

            <div class="geography-legend-item">
              <span
                class="geography-legend-swatch core"
                aria-hidden="true"
              ></span>
              <span data-geography-i18n="core"></span>
            </div>

            <div class="geography-legend-item">
              <span
                class="geography-legend-swatch fieldwork"
                aria-hidden="true"
              ></span>
              <span data-geography-i18n="fieldwork"></span>
            </div>

            <div class="geography-legend-item">
              <span
                class="geography-legend-swatch blended"
                aria-hidden="true"
              ></span>
              <span data-geography-i18n="blended"></span>
            </div>

          </div>

        </div>

        <figcaption>
          <strong
            class="geography-title"
            data-geography-i18n="title"
          ></strong>
          <span
            class="geography-caption"
            data-geography-i18n="caption"
          ></span>
        </figcaption>

      </figure>

      <div class="cutaway-fade-out" aria-hidden="true"></div>
    `;

    chaptersContainer.appendChild(feature);
  }

  /* XELI LANDSCAPE */

  if (chapter.id === "history-intro") {
    const feature = document.createElement("section");
    feature.className = "landscape-photo-feature";
    feature.id = "xeli-landscape-photo";

    feature.innerHTML = `
      <figure>
        <img
          src="./assets/IMG_2357.jpeg"
          alt="View from Xeli across mountain slopes and the valley"
          loading="lazy"
        >
        <figcaption>
          <span data-photo-i18n="description"></span>
          <span
            class="photo-credit"
            data-photo-i18n="credit"
          ></span>
        </figcaption>
      </figure>
    `;

    chaptersContainer.appendChild(feature);
  }

  /* MARIA MPINIARI'S MAP */

  if (chapter.id === "chapter-3-Schools") {
    const feature = document.createElement("section");
    feature.className = "memory-map-feature";
    feature.id = "maria-school-map";

    feature.innerHTML = `
      <figure>
        <button
          type="button"
          class="map-open"
          aria-label="Enlarge Maria Mpiniari's hand-drawn map"
        >
          <img
            src="./assets/maria-mpiniari-school-map.png"
            alt="Hand-drawn map by Maria Mpiniari"
            loading="lazy"
          >
        </button>

        <figcaption>
          <h2 data-map-i18n="title"></h2>
          <p
            class="map-credit"
            data-map-i18n="credit"
          ></p>
          <p
            class="map-caption"
            data-map-i18n="caption"
          ></p>
          <p
            class="map-hint"
            data-map-i18n="hint"
          ></p>
        </figcaption>
      </figure>

      <div class="cutaway-fade-out" aria-hidden="true"></div>
    `;

    chaptersContainer.appendChild(feature);
  }
});

/* HIDE NAV WHILE STATIC MAPS ARE CENTERED */

const staticMapSections = [
  document.getElementById("arvanite-geography-map"),
  document.getElementById("maria-school-map")
].filter(Boolean);

let visibilityUpdatePending = false;

function updateStaticMapVisibility() {
  visibilityUpdatePending = false;

  const middle = window.innerHeight * 0.5;

  const viewingMap = staticMapSections.some(section => {
    const rect = section.getBoundingClientRect();

    return rect.top <= middle && rect.bottom >= middle;
  });

  document.body.classList.toggle(
    "viewing-static-map",
    viewingMap
  );
}

function requestVisibilityUpdate() {
  if (visibilityUpdatePending) return;

  visibilityUpdatePending = true;
  requestAnimationFrame(updateStaticMapVisibility);
}

window.addEventListener(
  "scroll",
  requestVisibilityUpdate,
  { passive: true }
);

window.addEventListener(
  "resize",
  requestVisibilityUpdate
);

requestVisibilityUpdate();

/* MARIA MAP ENLARGEMENT */

const mapDialog = document.createElement("dialog");
mapDialog.className = "memory-map-dialog";

mapDialog.innerHTML = `
  <button type="button" class="close-map">Close ×</button>
  <img
    src="./assets/maria-mpiniari-school-map.png"
    alt="Enlarged hand-drawn map by Maria Mpiniari"
  >
`;

document.body.appendChild(mapDialog);

const mapOpenButton =
  document.querySelector(".memory-map-feature .map-open");

if (mapOpenButton) {
  mapOpenButton.addEventListener("click", () => {
    mapDialog.showModal();
  });
}

mapDialog.querySelector(".close-map")
  .addEventListener("click", () => mapDialog.close());

mapDialog.addEventListener("click", event => {
  if (event.target === mapDialog) mapDialog.close();
});

/* SCROLLYTELLING */

const scroller = scrollama();

function moveMapToChapter(chapter) {
  if (!chapter?.location) return;

  map.flyTo({
    ...getResponsiveLocation(chapter.location),
    duration: 1800,
    essential: true
  });
}

scroller
  .setup({ step: ".step", offset: 0.5 })
  .onStepEnter(response => {
    const chapter = config.chapters.find(
      item => item.id === response.element.dataset.id
    );

    moveMapToChapter(chapter);
  });

/* LANGUAGE */

function setLanguage(lang) {
  const greek = lang === "el"
    ? (config.translations?.el || {})
    : {};

  const site = greek.site || {};

  document.documentElement.lang = lang;

  document.getElementById("title").textContent =
    lang === "el"
      ? (site.title || englishTitle)
      : englishTitle;

  document.getElementById("subtitle").textContent =
    lang === "el"
      ? (site.subtitle || config.subtitle)
      : config.subtitle;

  document.getElementById("byline").innerHTML =
    lang === "el"
      ? (site.byline || config.byline)
      : config.byline;

  config.chapters.forEach(chapter => {
    const elements = chapterElements.get(chapter.id);
    if (!elements) return;

    const translation = lang === "el"
      ? (greek.chapters?.[chapter.id] || {})
      : {};

    elements.heading.textContent =
      translation.title || chapter.title || "";

    elements.paragraph.textContent =
      translation.description || chapter.description || "";
  });

  /* ARCGIS MAP AND LEGEND TRANSLATIONS */

  document.querySelectorAll("[data-geography-i18n]")
    .forEach(element => {
      element.textContent =
        geographyTranslations[lang][element.dataset.geographyI18n];
    });

  const geographyImage =
    document.querySelector(".geography-image");

  if (geographyImage) {
    geographyImage.alt = geographyTranslations[lang].alt;
  }

  const geographyLegend =
    document.querySelector(".geography-legend");

  if (geographyLegend) {
    geographyLegend.setAttribute(
      "aria-label",
      geographyTranslations[lang].legendHeading
    );
  }

  /* XELI PHOTO TRANSLATIONS */

  document.querySelectorAll("[data-photo-i18n]")
    .forEach(element => {
      element.textContent =
        photoTranslations[lang][element.dataset.photoI18n];
    });

  /* MARIA MAP TRANSLATIONS */

  document.querySelectorAll("[data-map-i18n]")
    .forEach(element => {
      const key = element.dataset.mapI18n;

      element.textContent = key === "caption"
        ? mariaNarrative[lang]
        : mapTranslations[lang][key];
    });

  mapDialog.querySelector(".close-map").textContent =
    mapTranslations[lang].close;

  if (mapOpenButton) {
    mapOpenButton.setAttribute(
      "aria-label",
      mapTranslations[lang].open
    );
  }

  /* NAVIGATION TRANSLATIONS */

  document.querySelectorAll("[data-nav]")
    .forEach(link => {
      link.textContent =
        navLabels[lang][link.dataset.nav];
    });

  document.getElementById("menu-toggle").textContent =
    navLabels[lang].menu;

  document.querySelectorAll(".language-button")
    .forEach(button => {
      button.setAttribute(
        "aria-pressed",
        String(button.dataset.lang === lang)
      );
    });

  try {
    localStorage.setItem("arvanitochoria-language", lang);
  } catch (_) {}

  requestAnimationFrame(() => {
    scroller.resize();
    requestVisibilityUpdate();
  });
}

/* NAVIGATION */

document.querySelectorAll('.nav-link[href^="#"]')
  .forEach(link => {
    link.addEventListener("click", event => {
      event.preventDefault();

      const id = link.getAttribute("href").slice(1);
      const target = document.getElementById(id);

      if (!target) return;

      document.getElementById("nav-links")
        .classList.remove("open");

      document.getElementById("menu-toggle")
        .setAttribute("aria-expanded", "false");

      target.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

      moveMapToChapter(
        config.chapters.find(chapter => chapter.id === id)
      );

      if (history.replaceState) {
        history.replaceState(null, "", `#${id}`);
      }
    });
  });

const menuToggle = document.getElementById("menu-toggle");

menuToggle.addEventListener("click", () => {
  const open = document.getElementById("nav-links")
    .classList.toggle("open");

  menuToggle.setAttribute("aria-expanded", String(open));
});

document.querySelectorAll(".language-button")
  .forEach(button => {
    button.addEventListener("click", () => {
      setLanguage(button.dataset.lang);
    });
  });

let initialLanguage = "en";

try {
  if (localStorage.getItem("arvanitochoria-language") === "el") {
    initialLanguage = "el";
  }
} catch (_) {}

setLanguage(initialLanguage);

window.addEventListener("resize", () => {
  map.resize();
  scroller.resize();
  requestVisibilityUpdate();
});

</script>
</body>
</html>
